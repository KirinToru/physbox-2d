name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build

      - name: Package Build
        run: |
          mkdir release
          Copy-Item build/PhysBox2D.exe release/
          Copy-Item -Recurse assets release/assets
          if (Test-Path build/*.dll) { Copy-Item build/*.dll release/ -ErrorAction SilentlyContinue }
          if (Test-Path lib/*.dll) { Copy-Item lib/*.dll release/ -ErrorAction SilentlyContinue }
          Compress-Archive -Path release/* -DestinationPath "PhysBox2D-${{ github.ref_name }}-win64.zip"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PhysBox2D-${{ github.ref_name }}-win64.zip
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxcursor-dev libudev-dev libopenal-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build

      - name: Package Build
        run: |
          mkdir release
          cp build/PhysBox2D release/
          cp -r assets release/assets
          mkdir -p release/lib
          find build -name "*.so*" -exec cp {} release/lib/ \;
          if [ -d "lib" ]; then cp -r lib/* release/lib/ || true; fi
          cd release && tar -czvf ../PhysBox2D-${{ github.ref_name }}-linux64.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PhysBox2D-${{ github.ref_name }}-linux64.tar.gz

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build

      - name: Package Build
        run: |
          mkdir release
          cp build/PhysBox2D release/
          cp -r assets release/assets
          mkdir -p release/lib
          find build -name "*.dylib" -exec cp {} release/lib/ \;
          if [ -d "lib" ]; then cp -r lib/* release/lib/ || true; fi
          cd release && zip -r ../PhysBox2D-${{ github.ref_name }}-macos-arm64.zip *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PhysBox2D-${{ github.ref_name }}-macos-arm64.zip

